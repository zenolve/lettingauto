<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  @page {
    size: A4;
    margin: 22mm 18mm 22mm 18mm;
    @top-left {
      content: "{{ brand_name }}";
      font-family: 'Inter', 'Helvetica', 'Arial', sans-serif;
      color: {{ brand_navy }};
      font-size: 9pt;
      font-weight: 700;
    }
    @top-right {
      content: "{{ title }}";
      font-family: 'Inter', 'Helvetica', 'Arial', sans-serif;
      color: #6b7280;
      font-size: 9pt;
    }
    @bottom-left { content: "{{ footer_text }}"; color:#9ca3af; font-size:8pt; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); color:#9ca3af; font-size:8pt; }
  }
  body {
    font-family: 'Inter', system-ui, 'Helvetica', 'Arial', sans-serif;
    font-size: 11pt;
    color: #1a1a18;
    line-height: 1.6;
  }
  /* Headings mirror the in-app editor (Editorial Mesh): Fraunces serif, ink —
     not the agency navy — so the downloaded PDF is WYSIWYG with the editor. */
  h1, h2, h3 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    color: #1a1a18;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 { font-size: 20pt; margin: 0 0 10pt 0; border-bottom: 2pt solid {{ brand_gold }}; padding-bottom: 4pt; }
  h2 { font-size: 14pt; margin: 18pt 0 4pt 0; }
  h3 { font-size: 12pt; margin: 12pt 0 3pt 0; }
  p { margin: 6pt 0; }
  table { border-collapse: collapse; width: 100%; margin: 8pt 0; }
  td, th { border: 0.5pt solid #d1d5db; padding: 5pt 8pt; vertical-align: top; }
  th { background: #f3f4f6; text-align: left; }
  ol, ul { padding-left: 18pt; }
  .signature-block { margin-top: 30pt; }
  .signature-block .line { border-bottom: 0.5pt solid #6b7280; width: 200pt; margin: 24pt 0 4pt 0; }
</style>
</head>
<body>
{{ body_html | safe }}
</body>
</html>
