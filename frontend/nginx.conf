server {
    listen 80;
    server_name _;

    # The upload endpoint accepts files up to 25 MB; allow some headroom.
    client_max_body_size 30M;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API + service routes -> FastAPI. Everything else is the SPA.
    location ~ ^/(api|auth|uploads|webhook|internal|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PDF rendering / DocuSign calls can take a while.
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Single-page app: serve the file if it exists, else fall back to index.html
    # so client-side routes (/agent/…, /landlord/…) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
