# Production stack — what you run on the DigitalOcean droplet.
#
#   1. Create backend/.env from backend/.env.example and fill in real values
#      (set APP_ENV=production and FRONTEND_BASE_URL=https://<your-domain>).
#   2. Put your DocuSign private key at backend/docusign_rsa.key.
#   3. docker compose up -d --build
#   4. Caddy serves HTTPS on 80/443 for the hostname in ./Caddyfile and
#      reverse-proxies to nginx.  (See DEPLOY.md for domain + TLS.)
#
# Request path: internet -> caddy (TLS, 80/443) -> web (nginx, serves the
# built frontend + proxies /api,/auth,/uploads,/webhook,/internal,/docs) ->
# backend (FastAPI :8000).  `web` and `backend` are internal-only now; Caddy
# is the sole public entrypoint.
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # Mounted (not baked into the image) so the key never lives in a layer.
      - ./backend/docusign_rsa.key:/app/docusign_rsa.key:ro
      # Persist runtime user data across rebuilds.
      - uploads:/app/uploads
      - signatures:/app/app/templates/signatures
    expose:
      - "8000"   # internal only; reached by nginx, not published to the host

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"   # internal only; Caddy is the public entrypoint

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"   # public HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # issued certs — MUST persist across rebuilds
      - caddy_config:/config

volumes:
  uploads:
  signatures:
  caddy_data:
  caddy_config:
