# Production stack — what you run on the DigitalOcean droplet.
#
#   1. Create backend/.env from backend/.env.example and fill in real values
#      (set APP_ENV=production and FRONTEND_BASE_URL=http://<your-domain-or-ip>).
#   2. Put your DocuSign private key at backend/docusign_rsa.key.
#   3. docker compose up -d --build
#   4. App is served on port 80.  (See DEPLOY.md for domain + TLS.)
#
# nginx (the `web` service) serves the built frontend and proxies /api, /auth,
# /uploads, /webhook, /internal, /docs to the backend over the internal network.
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # Mounted (not baked into the image) so the key never lives in a layer.
      - ./backend/docusign_rsa.key:/app/docusign_rsa.key:ro
      # Persist runtime user data across rebuilds.
      - uploads:/app/uploads
      - signatures:/app/app/templates/signatures
    expose:
      - "8000"   # internal only; reached by nginx, not published to the host

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  uploads:
  signatures:
