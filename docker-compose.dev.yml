# Local development stack (hot-reload). Run with:
#   docker compose -f docker-compose.dev.yml up
# For the production/droplet stack use the default docker-compose.yml.
services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
